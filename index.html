<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Embedder Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --sidebar-width: 260px;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #e5e7eb;
            --text-dark: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        /* Left History Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #ffffff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .sidebar.hidden {
            margin-left: calc(-1 * var(--sidebar-width));
        }

        .sidebar-header {
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .clear-btn:hover {
            text-decoration: underline;
        }

        .history-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding: 8px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
            color: #4b5563;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .history-item:hover {
            background-color: #f3f4f6;
            color: var(--primary-color);
        }

        .empty-history {
            text-align: center;
            color: #9ca3af;
            font-size: 0.85rem;
            margin-top: 20px;
        }

        /* Main Content Container */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Top Bar Controls */
        .top-bar {
            padding: 12px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .top-bar.hidden {
            display: none;
        }

        .url-input {
            flex-grow: 1;
            padding: 10px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .url-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .go-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .go-btn:hover {
            background-color: var(--primary-hover);
        }

        .fullscreen-btn {
            background-color: #4b5563;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fullscreen-btn:hover {
            background-color: #374151;
        }

        /* Requested Yellow Highlight Banner */
        .school-banner {
            background-color: #fef08a; /* Soft, readable yellow */
            color: #713f12; /* Dark yellow/brown text for high contrast accessibility */
            padding: 12px 20px;
            margin: 12px 20px 0 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
            border: 1px solid #fde047;
            text-align: center;
        }
        
        .school-banner a {
            color: #1d4ed8;
            font-weight: 600;
            text-decoration: underline;
        }

        /* Web Viewport Embedder */
        .viewport-wrapper {
            flex-grow: 1;
            background-color: #ffffff;
            position: relative;
            margin: 12px 20px 20px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Expanded Mode Styling */
        .main-container.fullscreen-mode .school-banner {
            display: none;
        }
        
        .main-container.fullscreen-mode .viewport-wrapper {
            margin: 0;
            border: none;
            border-radius: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .placeholder-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #6b7280;
        }

        .placeholder-message h2 {
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        /* Floating Exit button for Fullscreen */
        .exit-fullscreen-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: rgba(31, 41, 55, 0.85);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            display: none;
            z-index: 9999;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        
        .exit-fullscreen-btn:hover {
            background-color: rgba(17, 24, 39, 0.95);
        }
    </style>
</head>
<body>

    <!-- Floating Exit Button for full window override -->
    <button id="exitFullscreenBtn" class="exit-fullscreen-btn">Exit Full Screen (Esc)</button>

    <!-- Left Sidebar: History Tab -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>History</span>
            <button class="clear-btn" id="clearBtn">Clear All</button>
        </div>
        <ul class="history-list" id="historyList">
            <!-- Dynamic history items loaded via JS -->
        </ul>
    </aside>

    <!-- Right Side: Navigation & Embedded Iframe -->
    <main class="main-container" id="mainContainer">
        <div class="top-bar" id="topBar">
            <input type="text" id="urlInput" class="url-input" placeholder="Enter website URL (e.g., https://example.com)..." />
            <button id="goBtn" class="go-btn">Go</button>
            <button id="fullscreenBtn" class="fullscreen-btn">
                <span>⛶</span> Full Screen
            </button>
        </div>

        <!-- School Warning Yellow Banner -->
        <div class="school-banner">
            This is a basic web embedder made so that you can get past our school's blocking system. But it doesn't work with bigger websites (Google, YouTube, Discord, Etc.) So if you want that make sure to use <a href="https://browser.lol" target="_blank" rel="noopener noreferrer">Browser.lol</a>
        </div>

        <div class="viewport-wrapper">
            <div id="placeholder" class="placeholder-message">
                <h2>No Site Loaded</h2>
                <p>Type a URL above and click <strong>Go</strong> to embed a webpage.</p>
            </div>
            <iframe id="webViewport" style="display: none;"></iframe>
        </div>
    </main>

        const goBtn = document.getElementById('goBtn');
        const webViewport = document.getElementById('webViewport');
        const placeholder = document.getElementById('placeholder');
        const historyList = document.getElementById('historyList');
        const clearBtn = document.getElementById('clearBtn');
        
        // Fullscreen elements
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
        const sidebar = document.getElementById('sidebar');
        const topBar = document.getElementById('topBar');
        const mainContainer = document.getElementById('mainContainer');
